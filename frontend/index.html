<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paris Metro Navigator</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Paris Metro Navigator</h1>
      <nav>
        <a href="/index.html" class="nav-current">User</a>
        <a href="/admin.html">Admin</a>
      </nav>
    </header>

    <main class="app">
      <aside class="sidebar">
        <div id="disruption-banner" class="disruption" style="display: none"></div>

        <section class="panel">
          <h2>Plan a route</h2>
          <div class="row">
            <button id="btn-pick-start" class="primary-btn">Pick start</button>
            <span id="start-coord" class="coord">—</span>
          </div>
          <div class="row">
            <button id="btn-pick-end" class="primary-btn">Pick end</button>
            <span id="end-coord" class="coord">—</span>
          </div>
          <div class="row">
            <button id="btn-find" class="accent-btn">Find path</button>
            <button id="btn-reset" class="ghost-btn">Reset</button>
          </div>
        </section>

        <section class="panel">
          <h2>Itinerary</h2>
          <div id="result-banner"></div>
          <ol id="result-steps" class="steps"></ol>
        </section>

        <section class="panel">
          <h2>Filter lines</h2>
          <div id="line-toggles" class="line-toggles"></div>
          <div class="row" style="margin-top: 8px">
            <button id="btn-show-all-lines" class="ghost-btn">Show all</button>
            <button id="btn-hide-all-lines" class="ghost-btn">Hide all</button>
          </div>
        </section>

        <p class="hint">
          Tip: click <b>Pick start</b>, then click anywhere on the map. Repeat for <b>Pick end</b>. Then press <b>Find path</b>.
        </p>
      </aside>

      <div id="map" class="map"></div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/js/config.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/pathfinding.js"></script>
  </body>
</html>
